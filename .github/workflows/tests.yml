name: Testes, cobertura e SonarQube

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch: # executar manualmente, inclusive nos dias de aula

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend | testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar lockfile
        run: node --test tests/lockfile-consistency.test.js
      - name: Instalar dependências (lockfile)
        run: npm ci
      - name: Testes do frontend
        run: npm test
      - name: Build do frontend
        run: npm run build

  backend:
    name: Backend | testes e cobertura >= 70%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar pytest e exigir cobertura mínima de 70%
        env:
          DEBUG: 'True'
        run: |
          python -m pytest tests \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70
      - name: Guardar evidência de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 30

  sonarqube:
    name: SonarQube | análise de qualidade
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    # Secrets não são fornecidos a PRs externos; evita exposição involuntária.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend
      - name: Confirmar configuração do SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" ]]; then
            echo 'Configure SONAR_TOKEN e SONAR_HOST_URL em Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          test -s backend/coverage.xml
      - name: Enviar análise para o SonarQube
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
