name: Testes, cobertura e SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend:
    name: Testes e build do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar consistência do lockfile (sem instalar dependências)
        run: node --test tests/lockfile-consistency.test.js
      - name: Instalar dependências
        run: npm ci
      - name: Testar regras do carrinho
        run: npm test
      - name: Validar build
        run: npm run build

  tests:
    name: Testes e análise de qualidade
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Executar testes e gerar cobertura
        run: |
          pytest --cov=core --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Verificar relatório de cobertura
        run: |
          test -f coverage.xml
          ls -lh coverage.xml

      - name: Executar análise no SonarQube LABENS
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
