name: Testes de mutação (sob demanda)

on:
  push:
    branches:
      - 'feature/testes-mutacao' # prova inicial antes da integração
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutmut | regras de negócios
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mutation.txt
      - name: Instalar ferramentas de teste e mutação
        run: python -m pip install -r requirements-mutation.txt
      - name: Testar baseline antes de gerar mutantes
        env:
          DEBUG: 'True'
        run: python -m pytest tests --no-cov -q
      - name: Gerar e testar mutantes
        env:
          DEBUG: 'True'
        run: |
          set -o pipefail
          mutmut run 2>&1 | tee mutation-run.log
      - name: Resumo dos mutantes
        if: always()
        run: |
          mutmut results 2>&1 | tee mutation-results.txt || true
          mutmut junitxml > mutation-results.xml || true
      - name: Guardar artefatos de mutação (quando existirem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-mutacao
          path: |
            backend/.mutmut-cache
            backend/mutation-run.log
            backend/mutation-results.txt
            backend/mutation-results.xml
          if-no-files-found: ignore
          retention-days: 30
