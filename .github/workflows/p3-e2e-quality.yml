name: P3 - Sistema, IA, Usabilidade e Acessibilidade

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  p3-e2e-accessibility-ai:
    name: E2E, Usabilidade, WCAG e Testes Instrumentais com IA
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (Backend Django)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências do Backend
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar Banco de Dados de Teste
        working-directory: ./backend
        env:
          SECRET_KEY: 'ci-test-secret-key-comercializa'
          DEBUG: 'True'
        run: |
          python manage.py migrate

      - name: Configurar Node.js 20 (Frontend Vue)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Instalar navegadores do Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Executar Suíte P3 (Sistema + Usabilidade + WCAG + IA Instrumental)
        working-directory: ./frontend
        env:
          CI: 'true'
          SECRET_KEY: 'ci-test-secret-key-comercializa'
          DEBUG: 'True'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx playwright test

      - name: Publicar Relatório HTML e Artefatos de Evidência (P3)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-relatorio-sistema-a11y-ia
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 30