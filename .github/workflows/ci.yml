name: Tarefa 04 | CI/CD e Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend | testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar lockfile
        run: node --test tests/lockfile-consistency.test.js
      - name: Instalar dependências (lockfile)
        run: npm ci
      - name: Lint JavaScript e Vue
        run: node ../scripts/lint-frontend.mjs
      - name: Testes do frontend
        run: npm test
      - name: Build do frontend
        run: npm run build

  backend:
    name: Backend | testes e cobertura >= 70%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt ruff==0.11.13
      - name: Lint Python
        run: python -m ruff check .
      - name: Executar pytest e exigir cobertura mínima de 70%
        env:
          DEBUG: 'True'
        run: |
          python -m pytest tests \
            --cov=core \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70
      - name: Guardar evidência de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage.xml
          if-no-files-found: warn
          retention-days: 30

  sonarqube:
    name: SonarQube | análise de qualidade
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    # Secrets não são fornecidos a PRs externos; evita exposição involuntária.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend
      - name: Confirmar configuração do SonarQube
        id: sonar_config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        shell: bash
        run: |
          if [[ -z "$SONAR_TOKEN" || -z "$SONAR_HOST_URL" ]]; then
            echo '::notice::SonarQube não configurado; lint, testes e cobertura continuam obrigatórios.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -s backend/coverage.xml
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Enviar análise para o SonarQube
        if: steps.sonar_config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: -Dsonar.qualitygate.wait=true

  docker:
    name: Docker | build e smoke local
    needs: [frontend, backend, sonarqube]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t comercializa:ci .
      - name: Iniciar contêiner e verificar frontend e health
        shell: bash
        run: |
          docker run -d --name comercializa-ci -e DEBUG=True -p 127.0.0.1:8000:8000 comercializa:ci
          python scripts/smoke.py http://127.0.0.1:8000 --attempts 30 --delay 2
          curl --fail --silent http://127.0.0.1:8000/ | grep -q 'id="app"'
          curl --fail --silent http://127.0.0.1:8000/produtos | grep -q 'id="app"'
          curl --fail --silent http://127.0.0.1:8000/favicon-comercializa.svg > /dev/null
      - name: Logs do contêiner
        if: always()
        run: docker logs comercializa-ci || true
      - name: Remover contêiner
        if: always()
        run: docker rm -f comercializa-ci || true

  quality-gate:
    name: Quality Gate
    needs: [frontend, backend, sonarqube, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exigir sucesso de todos os jobs obrigatórios
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          SONAR: ${{ needs.sonarqube.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          printf 'frontend=%s backend=%s sonar=%s docker=%s\n' "$FRONTEND" "$BACKEND" "$SONAR" "$DOCKER"
          test "$FRONTEND" = success && test "$BACKEND" = success && test "$SONAR" = success && test "$DOCKER" = success

  deploy:
    name: CD | Render
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/tarefa04-cicd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: comercializa-tarefa04-render
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
      - name: Publicar exatamente o commit aprovado e aguardar Live
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Evita que uma execução antiga publique depois de um push mais recente.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/tarefa04-cicd" --jq .object.sha)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo 'Commit superado; deploy ignorado.'
            echo 'deployed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/deploy_render.py
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Smoke Test público (HTTP 200 e revisão)
        shell: bash
        if: steps.deploy.outputs.deployed == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL"
          python scripts/smoke.py "$APP_URL" --revision "$GITHUB_SHA" --attempts 12 --delay 10 | tee smoke-production.txt
      - name: Evidência do Smoke Test
        if: always() && steps.deploy.outputs.deployed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-production
          path: smoke-production.txt
          if-no-files-found: warn
