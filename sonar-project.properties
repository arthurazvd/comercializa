sonar.projectKey=comercializa
sonar.projectName=Comercializa
sonar.sourceEncoding=UTF-8

# Escopo da cobertura mínima: código Python do backend.
# O frontend tem testes Node, mas ainda não produz relatório de cobertura JS.
sonar.sources=backend/core
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/test_*.py
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.exclusions=backend/core/migrations/**,backend/core/management/commands/seed_demo.py,backend/**/__pycache__/**,backend/htmlcov/**
sonar.coverage.exclusions=backend/core/migrations/**,backend/core/management/commands/seed_demo.py,backend/core/admin.py,backend/core/apps.py

# Informar a versão de Python para evitar alertas de análise genérica.
sonar.python.version=3.12
